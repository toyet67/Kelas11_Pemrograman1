<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contoh css border</title>
    <style>
        /* contoh border pada elemen dengan class border-example */
        .border-example {
            width: 200pc;
            height: 100px;
            border: 2px solid purple;
            padding: 10px;
            margin: 20px;
        }

        /* contoh border dengan sebagai properti */
        .costum-border {
            width: 200px;
            height: 100px;
            border-width: 4px;
            border-style: solid;
            border-color: purple;
            padding: 10px;
            margin: 20px;
        }

        /* contoh border dengan sebagai properti */
        .costum-border {
            width: 200px;
            height: 100px;
            border-width: 4px;
            border-style: dotted;
            border-color: blue;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Contoh CSS Border</h1>
    <div class="border-example">
        <p>Ini adalah elemen denngan border solid biru.</p>
    </div>
    <div class="costum-border">
        <p>Ini adalah elemen dengan border costum (dotted biru).</p>
    </div>
</body>
</html>
