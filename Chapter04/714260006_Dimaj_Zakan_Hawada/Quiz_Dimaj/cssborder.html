<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border</title>
    <style>
        /*Contoh border pada elemen dengan class "border-example" */
        .border-example {
            width: 200px;
            height: 100px;
            border: 2px solid #3498db;
            padding: 10px;
            margin: 20px;
        }
        /*Contoh border pada elemen dengan berbagai properti */
        .custom-border {
            width: 200px;
            height: 100px;
            border-width: 4px;
            border-style: dotted;
            border-color: #e74c3c;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>CSS Border</h1>
    <div class="border-example">
        <p>Biru</p>
    </div>
    <div class="custom-border">
        <p>Merah</p>
    </div> 
</body>
</html>
