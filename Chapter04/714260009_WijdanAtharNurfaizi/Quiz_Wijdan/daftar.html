<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Workshop Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Workshop Web</h1>
        <nav aria-label="Navigasi Utama">
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="jadwal.html">Jadwal</a></li>
                <li><a href="daftar.html" aria-current="page">Daftar</a></li>
            </ul>
        </nav>
    </header>
    <main id="konten">
        <section>
            <h2>Form Pendaftaran</h2>
            <form action="" method="get">
                <div>
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" required minlength="1" placeholder="Tulis nama lengkap">
                </div>
                <div>
                    <label for="hp">Nomor HP</label>
                    <input type="tel" id="hp" name="hp" required pattern="[0-9]{10,14}" placeholder="Contoh 081234567890">
                </div>
                <div>
                    <label for="sesi">Pilihan Sesi</label>
                    <select id="sesi" name="sesi" required>
                        <option value="">Pilih satu sesi</option>
                        <option value="html">HTML Semantik</option>
                        <option value="css">CSS Dasar</option>
                        <option value="git">Git dan Publikasi</option>
                    </select>
                </div>
                <div>
                    <span>Kehadiran</span>
                    <label><input type="radio" name="hadir" value="luring" checked> Tatap Muka</label>
                    <label><input type="radio" name="hadir" value="daring"> Online</label>
                </div>
                <div>
                    <label for="semester">Semester</label>
                    <input type="number" id="semester" name="semester" min="1" max="8" value="1" required>
                </div>
                <div>
                    <label for="catatan">Catatan</label>
                    <textarea id="catatan" name="catatan" rows="3" placeholder="Contoh butuh colokan listrik"></textarea>
                </div>
                <div>
                    <button type="submit">Kirim pendaftaran</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; Workshop Web. Gedung Auditorium. Kontak panitia 0812-3456-7890.</p>
    </footer>
</body>
</html>
