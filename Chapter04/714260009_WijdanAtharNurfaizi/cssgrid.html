<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid dan Selector</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item {
            background-color: aqua;
            color: whitesmoke;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        /* selector untuk elemen dengna class 'special' */
        .special {
            background-color: aqua;
        }

        /* selector untuk elemen dengnan id 'unique' */
        #unique {
            background-color: aqua;
        }

        /* selector untuk elemen <p> yang ada didalam class 'container' */
        .container {
            font-style: italic;
        }    
    </style>
</head>
<body>
    <h1>CSS Grid dan Selector</h1>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item special">Item 3 (Special)</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item" id="unique">Item 6 (Unique)</div>
    </div>
    <P>Ini adalah contoh teks dalam class "container".</P>
    <p>Ini adalah contoh teks di luar class "container".</p>
</body>
</html>
