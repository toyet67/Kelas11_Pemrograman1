<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css border</title>
    <style>
        .border1 {
            width: 10rem;
            height: 5rem;
            border: 0.1rem solid #347813;
            padding: 0.7rem;
            margin: 1.1rem;
        }
        .costum {
            width: 15rem;
            height: 7rem;
            border-width: 0.5rem;
            border-style: dotted;
            border-color: cornflowerblue;
            margin: 35px;
        }
    </style>
</head>
<body>
    <h1>Contoh CSS Border</h1>
    <div class="border1">
        <p>elemen border solid biru</p>
    </div>
    <div class="costum">
        <p>border costum dotted blue Lorem ipsum dolor sit amet, consectetur adipisicing elit. Reprehenderit, harum!</p>
    </div>
</body>
</html>
