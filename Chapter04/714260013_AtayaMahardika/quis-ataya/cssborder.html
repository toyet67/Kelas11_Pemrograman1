<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border CSS</title>
    <style>
        .border-example {
            width: 300px;
            height: 50px;
            border: 1px solid #1a3264;
            padding: 100px;
            margin: 40px;
        }
        .custom-border {
            width: 500px;
            height: 300px;
            border-width: 100px;
            border-style: dotted;
            border-color: #616f8d;
            margin: 20px;
            text-align: center;
            padding: 90px;
        }
    </style>
</head>
<body>
    <h1>BORDER CSS</h1>
    <div class="border-example">
        <p>Ini adalah elemen dengan border ngaco</p>
    </div>
    <div class="custom-border">
        <p>Ini adalah elemen dengan border</p>
    </div>
</body>
</html>
