<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding dan table</title>
    <style>
        table {
            background-color: aquamarine;
            color: #fff;
        }
        td {
            padding: 0.5rem;
        }
        tr {
            border-bottom: 1px solid #fff;
        }
        tr:hover {
            background-color: blueviolet;
        }
        tr:nth-child(even) {
            background-color: bisque;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>Ataya lantai 1</td>
            <td>kos ataya lantai 1</td>
        </tr>
        <tr>
            <td>Arsi lantai 2</td>
            <td>kos Arsi 2</td>
        </tr>
        <tr>
            <td>Paijo 3</td>
            <td>kos paijo 3</td>
        </tr>
    </table>
</body>
</html>
