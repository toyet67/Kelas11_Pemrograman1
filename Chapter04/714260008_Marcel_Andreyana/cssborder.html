<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh CSS Border</title>
    <style>
        /* Contoh border pada elemen dgn class "border-example" */
        .border-example {
            width: 200px;
            height: 100px;
            border: 2px solid rgb(188, 191, 255);
            padding: 10px;
            margin: 20px;
        }

        /* Contoh border dengan berbagai properti */
        .custom-border {
            width: 200px;
            height: 100px;
            border-width: 4px;
            border-style: dotted; 
            border-color: blueviolet;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Contoh CSS Border</h1>
    <div class="border-example">
        <p>Ini adalah elemen dengan border solid biruu</p>
    </div>
    <div class="custom-border">
        <p>Ini adalah elemen dengan border custom (Polkadot)</p>
    </div>
</body>
</html>
