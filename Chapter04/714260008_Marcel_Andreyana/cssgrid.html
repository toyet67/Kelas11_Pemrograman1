<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid dan Selector</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item{
            background-color: aquamarine;
            color: beige;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }
        
        /* Selector untuk elemen dengan class "special" */
        .special {
            background-color: rgb(9, 65, 46);
        }
        /* Selector untuk elemen dengan id "unique" */
        .unique {
            background-color: rgb(94, 86, 68);
        }

        .container p {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>CSS Grid dan Selector</h1>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item special">Item 3 (special)</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item unique">Item 6 (Unique)</div>
    </div>
    <p>Ini adalah contoh teks dalam class "container".</p>
    <p>Ini adalah contoh teks di luar class "container".</p>
</body>
</html>
