<body>
    <style>
        .container {
            display: display;
            grid-template-columns: reoeat(3, 1fr);
            gap: 10px;
        }

        .item {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        /* Selector untuk elemen dengan class "spesial" */
        .special {
            background-color: #e74c3c;
        }
        /* Selector unutk elemen dengan id "unique" */
        #unique {
            background-color: #27ae68;
        }

        /* Selector untuk elemen <p> yang ada dalma class "container" */
            .container p {
                font-style: italic;
            }
    </style>
  <head>
  </body>
     <h1>CSS Grid dan Selector</h1>
     <div class-"container">
        <div class-"item">Item 1</div>
        <div class-"item">Item 2</div>
        <div class-"item special">Item 3 (Special)</div>
        <div class-"item">Item 4</div>
        <div class-"Item">Item 5</div>
        <div class-"Item" id-"unique">Item 6 (Unique)</div>
     </div>
     <p>Ini adalah contoh teks dalam class "container</p>
     <p>Ini adalah contoh teks di luar "container</p>
