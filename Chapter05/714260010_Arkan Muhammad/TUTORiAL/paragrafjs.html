<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paragraf JavaScript</title>
    <!-- JavaScript disimpan di antara head -->
    <script>
      function myFunction() {
        document.getElementById("demo").innerHTML =
          "Yeee, Berhasil, ini adalah hasil dari Memasukan JavaScrip pada Head HTML Awas Jangan salah ya? iya pak.. hehe.";
      }
    </script>
  </head>
  <body>
    <!-- Bagian body -->
    <h2>Paragrafnya harus berubah siap, Sok di klik dlu button nya</h2>
    <p id="demo">Nyobaan JavaScript yang disimpan pada HEAD</p>
    <button type="button" onclick="myFunction()">Coba Klik</button>
  </body>
</html>
