<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mengganti Atribut dan Value</title>
  </head>
  <body>
    <h2>Apa yang bisa dilakukan oleh JavaScript?</h2>
    <p>JavaScript bisa mengganti atribut dari value.</p>
    <p>Studi kasus disini JavaScript merubah nilai dari atribut sebuah gambar bola lampu</p>

    <button
      onclick="document.getElementById('myImage').src='pic_bulbon.gif'"
    >
      Nyalakan Lampunya
    </button>

    <img id="myImage" src="pic_bulboff.gif" style="width: 100px" />

    <button
      onclick="document.getElementById('myImage').src='pic_bulboff.gif'"
    >
      Matikan Lampunya
    </button>
  </body>
</html>
