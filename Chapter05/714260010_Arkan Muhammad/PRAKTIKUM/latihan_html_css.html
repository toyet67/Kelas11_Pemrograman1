<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Review</title>
  </head>
  <body>
    <!-- 1. Membuat Button 'Click' -->
    <button onclick="alert('Kamu mengklik tombol Click')">Click</button>

    <!-- 2. Membuat 2 Button: Nama anda dan Makanan Favorite -->
    <p>
      <button onclick="alert('Nama saya: (isi namamu di sini)')">Nama Anda</button>
      <button onclick="alert('Makanan favorit saya: (isi makananmu di sini)')">Makanan Favorite</button>
    </p>

    <!-- 3. Membuat paragraph "Hello World!" -->
    <p>Hello World!</p>

    <!-- 4. Paragraph dan narasi lain di bawahnya -->
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Reiciendis ut
      obcaecati blanditiis recusandae autem labore ipsa excepturi incidunt
      <button>hello</button> molestiae.
    </p>
    <p>
      Narasi lain: halaman ini dibuat sebagai latihan HTML dan CSS dasar
      sebelum belajar JavaScript.
    </p>
  </body>
</html>
