<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font</title>
</head>
<body>
    <h2>apa yang bisa dikakukan JS</h2>
    <p id="demo">JS bisa mengganti style dari HTML element.</p>
    <button type="button" onclick="document.getElementById('demo').style.fontSize = '35px'">Klik Disini!</button>
</body>
</html>
