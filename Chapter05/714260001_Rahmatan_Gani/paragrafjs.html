<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paragraft js</title>
    <script>
        function myFunction() {
            document.getElementById("demo").innerHTML = "Yee berhasil mengubah paragraf yang simple hasil dari memasukkan javascript pada head html";
        }
    </script>
</head>
<body>
    <h2>JS disimpan di head</h2>
    <p id="demo">Ini adalah paragraf yang simple</p>
    <button type="button" onclick="myFunction()">Klik Disini!</button>
</body>
</html>
