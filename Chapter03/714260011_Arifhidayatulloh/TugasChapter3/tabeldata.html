<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Tabel HTML</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Data Karyawan</h2>
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Jabatan</th>
                <th>Kota</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Budi Santoso</td>
                <td>Developer</td>
                <td>Bandung</td>
            </tr>
            <tr>
                <td>Siti Rahma</td>
                <td>Designer</td>
                <td>Jakarta</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
